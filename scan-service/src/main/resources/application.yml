server:
  port: 8082

spring:
  application:
    name: scan-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/eco_scan_db?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_schema: eco_scan_db
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

# Shared token for /internal/** calls from other services. Supplied only through the environment;
# when empty, the internal endpoints refuse every call.
internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:644cd999ddc585357cac317ba242e7f28a6718639fe94d1d}
